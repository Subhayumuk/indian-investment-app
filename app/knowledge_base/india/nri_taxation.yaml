residency_rules:
  resident_ordinary:
    description: "Present in India >= 182 days in the FY, or >= 60 days in FY and >= 365 days in preceding 4 FYs"
    tax_on_global_income: true
  rnor:
    description: "Resident but Not Ordinarily Resident — transitional status"
    conditions:
      - "NRI for 9 out of 10 preceding FYs"
      - "Present in India <= 729 days in preceding 7 FYs"
    tax_on_global_income: false
    tax_on_india_income: true
  non_resident:
    description: "Does not meet resident criteria"
    tax_on_global_income: false
    tax_on_india_income: true

