name: Refresh AMFI fund category index & shortlists

# Phase E: regenerates two committed data files in one run -
# app/knowledge_base/amfi_category_index.json (E1, from AMFI's live
# NAVAll.txt) and app/knowledge_base/fund_category_shortlists.json (E2,
# built on top of E1's index plus real mfapi.in trailing returns - see
# scripts/refresh_amfi_category_index.py and
# scripts/refresh_fund_category_shortlists.py). E2 depends on E1 having
# just run, which is why both live in one job rather than two. Unlike
# kb-freshness-check.yml's fingerprint-only auto-commit, this opens a PR
# for human review instead of pushing straight to main - the content here
# is a financial-fact claim (fund categories, real named funds, real
# returns) feeding user-facing output, not just a "this page changed" hash.
on:
  schedule:
    # 07:00 UTC on the 1st of every month - offset an hour from
    # kb-freshness-check.yml's 06:00 slot so they don't contend for the
    # same runner minute. Monthly for the same "avoid the 60-day
    # inactivity auto-disable" reason noted in kb-freshness-check.yml.
    - cron: "0 7 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run category index refresh
        # Must run as a module (-m), not a bare script path - a bare
        # `python scripts/refresh_amfi_category_index.py` doesn't put the
        # repo root on sys.path, so `import app.modules...` fails with
        # ModuleNotFoundError (reproduced locally, confirmed the cause of
        # the first run's failure - pytest didn't catch this since
        # pytest.ini's `pythonpath = .` only applies to pytest itself).
        run: python -m scripts.refresh_amfi_category_index

      - name: Run fund shortlist refresh (E2, depends on the index above)
        # Throttled via MfApiClient's own rate limiting (see
        # app/modules/mfapi_client.py) - this makes far more mfapi.in
        # calls than a single Holdings Review request does, so this step
        # can take a while; that's expected, not a hang.
        run: python -m scripts.refresh_fund_category_shortlists

      - name: Open PR if either file changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh AMFI fund category index & shortlists"
          title: "Refresh AMFI fund category index & shortlists"
          body: |
            Automated monthly refresh of two committed data files:
            - `app/knowledge_base/amfi_category_index.json` from AMFI's live NAVAll.txt (scripts/refresh_amfi_category_index.py)
            - `app/knowledge_base/fund_category_shortlists.json`, built on top of the index above plus real mfapi.in trailing returns (scripts/refresh_fund_category_shortlists.py) - this is what `instrument_catalog.py` substitutes into its new-money fund suggestions in place of a placeholder entry.

            Both feed real financial-fact claims into the app - review the diff before merging, same reasoning as any other change to committed data that reaches users.
          branch: auto/amfi-category-refresh
          delete-branch: true
          labels: automated-pr
