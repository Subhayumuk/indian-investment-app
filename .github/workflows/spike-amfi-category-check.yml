name: "[Spike] AMFI category header check"

# Throwaway diagnostic for Phase E's E0 step - answers whether a GitHub
# Actions runner can reach amfiindia.com, and whether NAVAll.txt still
# carries category-header lines. Delete this workflow (and
# scripts/spike_check_amfi_categories.py) once that question is answered -
# it is not meant to become permanent CI.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run spike check
        run: python scripts/spike_check_amfi_categories.py
