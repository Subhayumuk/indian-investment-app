name: SPIKE - diagnose AMFI category header format

# Throwaway, workflow_dispatch-only diagnostic - see
# scripts/spike_diagnose_amfi_format.py's docstring for why this exists
# again (same pattern as the original E0 spike, since removed). Delete
# both this file and the script once the live-file question is answered
# and the real fix (if any) lands in amfi_nav_client.py.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose AMFI NAVAll.txt header format
        run: python -m scripts.spike_diagnose_amfi_format
